name: Monthly Goodreads & YouTube Sync

on:
  workflow_dispatch:
  schedule:
    # Runs at 06:00 UTC on day 1 of every month
    - cron: '0 6 1 * *'

jobs:
  sync-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Fetch Goodreads and YouTube data
        run: node scripts/fetch-goodreads.js
        env:
          GOODREADS_USER_ID: '116793505'

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: automated monthly books sync [skip ci]" && git push)
